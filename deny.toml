[graph]
all-features = false

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0012", reason = "backoff 0.4.0 is reachable only through pocket-ic 15.0.0 in the Event Horizon integration-test package; it is not a production canister dependency." },
  { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is reachable only through backoff -> pocket-ic in integration tests; it is not a production canister dependency." },
  { id = "RUSTSEC-2024-0436", reason = "paste is pulled by candid as proc-macro/build support; current compatible Candid still uses it and Event Horizon contains no application logic from this crate." },
  { id = "RUSTSEC-2021-0127", reason = "serde_cbor 0.11.2 is reachable through the certified informational frontend and PocketIC test tooling, not the value-moving backend runtime." },
]

[licenses]
unused-allowed-license = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "BlueOak-1.0.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
